server:
  port: 8888

spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/life_equation?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY}
    url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat

zhipuai:
  api:
    key: ${ZHIPUAI_API_KEY}
    url: https://open.bigmodel.cn/api/paas/v4/chat/completions
    model: glm-4v-plus

# 应用访问基准 URL（base64 模式下不再依赖此配置，保留用于图片存档访问）
app:
  base-url: http://localhost:8888

file:
  upload:
    path: C:/Users/ZH/IdeaProjects/Quation of Life/uploads

# 高德地图地理编码（每天免费5000次）
gaode:
  map:
    ak: ${GAODE_MAP_AK}

# 微信小程序登录
wechat:
  miniapp:
    appid: ${WECHAT_APPID}
    secret: ${WECHAT_SECRET}
