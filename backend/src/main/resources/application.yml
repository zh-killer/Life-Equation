server:
  port: 8888

spring:
  # 本地密钥从项目根目录 config/application-local.yml 读取（该文件不进仓库）
  # 首次运行：把 config/application-local.yml.example 复制为 config/application-local.yml 并填入自己的 Key
  config:
    import: optional:file:./config/application-local.yml

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/life_equation?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

jwt:
  # 不提供默认值：必须由环境变量 JWT_SECRET 或本地 config/application-local.yml 提供。
  # 公开的默认密钥等于没有密钥——任何人都能离线签出 role=ADMIN 的令牌。
  secret: ${JWT_SECRET:}
  expiration: 86400000

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:}
    url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
    # 报告图片识别用的多模态模型（deepseek-flash = V4.1-Flash，支持文字+图片输入）
    vision-model: deepseek-flash
    vision-max-tokens: 3000

# 应用访问基准 URL（base64 模式下不再依赖此配置，保留用于图片存档访问）
app:
  base-url: http://localhost:8888

file:
  upload:
    # 相对路径：默认落在启动目录下的 uploads/（IDEA 与 mvn spring-boot:run 都是 backend/）。
    # 不要写死绝对路径 —— 换台机器/换用户目录就写不进去，报告图和头像会直接上传失败。
    # 需要改位置就设环境变量 FILE_UPLOAD_PATH。
    path: ${FILE_UPLOAD_PATH:./uploads}

# 高德地图地理编码（每天免费5000次）
gaode:
  map:
    ak: ${GAODE_AK:}

# 微信小程序登录
wechat:
  miniapp:
    appid: ${WECHAT_APPID:wx5b6730e12c9f2469}
    secret: ${WECHAT_SECRET:}
